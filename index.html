<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACCL · WorkTrac360</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkTrac360">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --navy:#1F4E78; --navy2:#2E6DA4; --blue:#2E86C1; --teal:#17A589; --orange:#E67E22;
    --red:#C0392B; --purple:#8E44AD; --grey:#7F8C8D; --line:#e1e8ef; --bg:#eef1f5;
    --card:#ffffff; --ink:#1f2a33; --muted:#6b7783;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;
    background:linear-gradient(135deg,#16385a,#2E86C1)}
  .auth-card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:470px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .auth-logo{width:42px;height:42px;border-radius:11px;background:var(--navy);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.5px}
  .auth-brand h1{margin:0;font-size:18px;color:var(--navy)}
  .auth-brand span{font-size:12px;color:var(--muted)}
  .auth-card p.lead{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
  .link{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline}
  .topbar{background:var(--navy);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
  .topbar .brand .mk{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .topbar .brand small{display:block;font-weight:400;color:#bcd3e8;font-size:11px}
  .topbar .spacer{flex:1}
  .who{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:#2E86C1;color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:13px}
  .who .nm{font-size:13px;font-weight:600;line-height:1.25}
  .who .nm small{display:block;font-weight:400;color:#bcd3e8;font-size:11px}
  .nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
  .nav button{background:none;border:none;padding:13px 14px;cursor:pointer;color:var(--muted);font-weight:600;
    border-bottom:3px solid transparent;white-space:nowrap;position:relative}
  .nav button.active{color:var(--navy);border-bottom-color:var(--navy)}
  .nav .cnt{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:5px;font-weight:700}
  .wrap{padding:20px;max-width:1280px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy)}
  .card .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .card h3{margin:16px 0 8px;font-size:14px;color:var(--navy)}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
  @media(max-width:520px){.g4{grid-template-columns:1fr}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;text-align:center}
  .kpi .v{font-size:25px;font-weight:700;color:var(--navy)}
  .kpi .l{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:4px;text-transform:uppercase}
  .kpi2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi2 .t{font-size:12px;color:var(--muted);font-weight:600}
  .kpi2 .n{font-size:28px;font-weight:700;color:var(--navy);margin:6px 0 4px;line-height:1.1}
  .kpi2 .s{font-size:11.5px;color:var(--muted)}
  .sbar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:#eef1f5}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--navy2)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #c7d9ea}
  .btn.ghost:hover{background:#f0f6fc}
  .btn.green{background:var(--teal)} .btn.green:hover{background:#128f76}
  .btn.red{background:var(--red)} .btn.red:hover{background:#a5311f}
  .btn.grey{background:var(--grey)} .btn.grey:hover{background:#6b7879}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cfd8e2;border-radius:8px;background:#fff;width:100%}
  .field textarea{min-height:70px;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--navy);color:#fff;text-align:left;padding:9px 8px;font-weight:600}
  td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
  tr:nth-child(even) td{background:#fafcfe}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-grey{background:#e6eaee;color:#546e7a}
  .b-blue{background:#e3f0fa;color:#1c6ea4}
  .b-orange{background:#fdf0e2;color:#b06012}
  .b-red{background:#fdeaea;color:#a5311f}
  .b-green{background:#e0f7ea;color:#1E8449}
  .b-teal{background:#dcf5e6;color:#145A32}
  .b-purple{background:#f2e9f9;color:#6d33a3}
  .muted{color:var(--muted)} .small{font-size:12px}
  .bar{height:20px;border-radius:5px;background:#e8edf3;overflow:hidden}
  .bar>i{display:block;height:100%}
  .modal-bg{position:fixed;inset:0;background:rgba(15,30,45,.55);display:flex;align-items:flex-start;justify-content:center;
    padding:24px 12px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:720px;padding:20px}
  .modal h2{margin:0 0 12px;color:var(--navy);font-size:17px}
  .pill{display:inline-block;background:#eef3f8;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:2px 4px 2px 0;color:#40515f}
  .toast{position:fixed;right:18px;bottom:18px;background:#12304a;color:#fff;padding:12px 16px;border-radius:9px;z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  .taskrow{display:grid;grid-template-columns:1fr 90px 120px 130px 110px 34px;gap:8px;margin-bottom:8px;align-items:center}
  @media(max-width:900px){.taskrow{grid-template-columns:1fr 1fr}}
  .hint{font-size:11.5px;color:var(--muted);margin-top:-4px}
  .note{background:#fff8e6;border:1px solid #f3e0b3;color:#7a5a12;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .ok{background:#e6f7f1;border:1px solid #b7e6d8;color:#0f7a63;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .nrow{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:9px;background:#fff}
  .nrow.unread{background:#f2f8ff;border-color:#cfe3f7}
  .nrow .t{font-weight:700;color:var(--navy)}
  .nrow .b{font-size:12.5px;color:#40515f;white-space:pre-wrap;margin-top:3px}
  .nrow .m{font-size:11px;color:var(--muted);margin-top:5px}

  /* ---------------- Mobile / responsive ---------------- */
  .tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav{-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  @media(max-width:900px){
    .taskrow > input:first-child{grid-column:1 / -1}
    .taskrow > button{justify-self:start}
  }
  @media(max-width:760px){
    .wrap{padding:14px 12px}
    .card{padding:14px;border-radius:10px}
    .card h2{font-size:15px}
    .topbar{padding:10px 12px;gap:8px}
    .topbar .brand small{display:none}
    .who .nm small{font-size:10px}
    .nav button{padding:11px 12px;font-size:13px}
    .modal{padding:16px}
    .modal h2{font-size:16px}
    .kpi .v{font-size:22px}
    .kpi2 .n{font-size:24px}
    .field[style*="min-width"]{min-width:0 !important}
    input,select,textarea{font-size:16px}
  }
  @media(max-width:560px){
    .wrap{padding:12px 10px}
    .topbar .brand .mk{width:26px;height:26px;font-size:11px}
    .avatar{width:30px;height:30px;font-size:12px}
    .who .nm{font-size:12px}
    .g2,.g3,.g4{grid-template-columns:1fr}
    .stats{gap:10px}
    .taskrow.small{display:none}
    .modal{padding:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   ACCL — WORKTRAC360
   Account types: Supervisor | Team Member.  Identity = Enroll ID only.
   Data stored in this browser (localStorage). Notifications are in-app.
   ========================================================================= */

const SECTIONS = ["Production","Packer","Quality","Inventory","HR & Admin","Mechanical","Electrical",
  "Power Plant","Distribution","Sustainability","OPEX","Civil","Finance"];

const STATUSES = ["Not Started","In Progress","Need Support","Blocked","Done","Verified","Reopened"];
const MEMBER_STATUSES = ["Not Started","In Progress","Need Support","Blocked","Done"];
const PRIORITIES = ["High","Medium","Low"];
const SHIFTS = ["General","Durbar","Durjoy","Duronto"];
const FREQ = ["One-time","Daily","Weekly","Monthly"];

const STATUS_COLOR = {"Not Started":"b-grey","In Progress":"b-blue","Need Support":"b-orange",
  "Blocked":"b-red","Done":"b-green","Verified":"b-teal","Reopened":"b-purple"};
const STATUS_HEX = {"Not Started":"#B0BEC5","In Progress":"#2E86C1","Need Support":"#E67E22",
  "Blocked":"#C0392B","Done":"#2ECC71","Verified":"#1E8449","Reopened":"#8E44AD"};
const PRIO_COLOR = {"High":"b-red","Medium":"b-orange","Low":"b-grey"};

const LS = 'accl_task_system_v6';

/* Super Admin self-registration is protected by this setup code.
   CHANGE IT to your own value (share only with OPEX leads). */
const SUPER_SETUP_CODE = 'ACCL-OPEX-2026';

/* suggested designations (typing is free — these are only hints) */
const ROLE_HINTS = {
  "Production":["Shift Incharge","Line Operator","Packer Operator","Kiln Operator","Helper"],
  "Packer":["Bagging Incharge","Packer Operator","Helper"],
  "Quality":["QC Incharge","QC Inspector","Chemist","Lab Assistant"],
  "Inventory":["Store Officer","Store Keeper"],
  "HR & Admin":["HR Officer","Admin Officer","Security Guard"],
  "Mechanical":["Maintenance Incharge","Fitter","Welder","Technician"],
  "Electrical":["Electrical Incharge","Electrician","Instrument Technician"],
  "Power Plant":["Power Plant Operator","Boiler Operator"],
  "Distribution":["Dispatch Officer","Loader"],
  "Sustainability":["Sustainability Officer"],
  "OPEX":["OPEX Officer","Data Analyst"],
  "Civil":["Civil Technician"],
  "Finance":["Accountant","Finance Officer"]
};
const SUPERVISOR_HINT = {
  "Production":"Shift Incharge","Packer":"Bagging Incharge","Quality":"QC Incharge",
  "Inventory":"Store Incharge","HR & Admin":"HR Incharge","Mechanical":"Maintenance Incharge",
  "Electrical":"Electrical Incharge","Power Plant":"Power Plant Incharge","Distribution":"Dispatch Incharge",
  "Sustainability":"Sustainability Incharge","OPEX":"OPEX Incharge","Civil":"Civil Incharge","Finance":"Finance Incharge"
};

/* ------------------------------- state ---------------------------------- */
function blankDB(){
  return {users:[], roles:[], dict:[], tasks:[], notify:[], settings:{dailyMinutes:480}, seq:{task:1, role:1, dict:1}};
}
let DB;
function load(){ try{ const raw=localStorage.getItem(LS); DB=raw?JSON.parse(raw):blankDB(); }catch(e){ DB=blankDB(); } if(!DB.seq) DB.seq=blankDB().seq; if(!DB.settings) DB.settings={dailyMinutes:480}; }

/* ---- Backend sync: Google Sheets + Apps Script ----
   Configure the Web App URL + token in the app's Sync dialog (top bar).
   With no URL set, the app runs browser-only (localStorage). */
const DEFAULT_API_URL='https://script.google.com/macros/s/AKfycbyaYcfA1GYRXavQKhnGZLyj6IpORkqX2sRWNgsNXhRkyh8-7DFskFHsGzX4deSYMlRq/exec';
const DEFAULT_API_TOKEN='CHANGE_ME_worktrac_secret';
let API_OK=false, API_AT=0;
function apiUrl(){ const v=localStorage.getItem('wt360_api_url'); return (v===null?DEFAULT_API_URL:v).trim(); }
function apiToken(){ return DEFAULT_API_TOKEN; }
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){}
  const u=apiUrl(); if(!u) return;
  fetch(u,{method:'POST',body:JSON.stringify({token:apiToken(),action:'save',db:DB})})
    .then(r=>r.json()).then(j=>{ API_OK=!!(j&&j.ok); API_AT=Date.now(); }).catch(()=>{ API_OK=false; });
}
/* Google Sheets returns numeric enroll IDs as numbers and dates as Date objects.
   Normalise them back to the types the app expects. */
function normalizeDB(){
  ['users','roles','dict','tasks','notify'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
  DB.users.forEach(u=>{ u.enroll=String(u.enroll==null?'':u.enroll); u.name=String(u.name||''); u.role=String(u.role||''); });
  DB.roles.forEach(r=>{ r.name=String(r.name||''); });
  DB.dict.forEach(d=>{ d.estMin=+d.estMin||0; d.title=String(d.title||''); });
  DB.tasks.forEach(t=>{
    t.dueDate = t.dueDate ? String(t.dueDate).slice(0,10) : '';
    t.estMin=+t.estMin||0; t.actualMin=+t.actualMin||0;
    if(!Array.isArray(t.attachments)) t.attachments=[];
    if(!Array.isArray(t.comments)) t.comments=[];
    if(t.timerStart===undefined) t.timerStart=null;
  });
  DB.notify.forEach(n=>{ n.read=!!n.read; });
}
async function apiLoad(){
  const u=apiUrl(); if(!u) return false;
  try{
    const r=await fetch(u+'?action=load&token='+encodeURIComponent(apiToken()));
    const j=await r.json();
    if(j&&j.ok&&j.db){
      DB=j.db;
      if(!DB.seq) DB.seq=blankDB().seq;
      if(!DB.settings) DB.settings={dailyMinutes:480};
      normalizeDB();
      try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){}
      API_OK=true; API_AT=Date.now(); return true;
    }
    API_OK=false;
  }catch(e){ API_OK=false; }
  return false;
}
function syncDot(){ return API_OK?'●':(apiUrl()?'◐':'○'); }
function openSync(){
  const u=apiUrl();
  modal(`<h2>Backend sync — Google Sheets</h2>
    <p class="desc">Paste your Apps Script Web App URL (ends with <b>/exec</b>). Leave blank to use this browser only.</p>
    <div class="field"><label>Web App URL</label><input id="syncUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="${esc(u)}"></div>
    <div id="syncStatus" class="small muted">${u?(API_OK?'Connected.':'Configured — not verified yet.'):'Not configured (browser-only mode).'}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn green" onclick="testSync()">Test connection</button>
      <button class="btn" onclick="saveSync()">Save &amp; sync now</button>
      <button class="btn ghost" onclick="clearSync()">Disconnect</button>
      <button class="btn grey" onclick="closeModal()">Close</button>
    </div>`);
}
function readSyncInputs(){
  localStorage.setItem('wt360_api_url',(document.getElementById('syncUrl').value||'').trim());
}
function testSync(){
  readSyncInputs();
  const st=document.getElementById('syncStatus'); st.textContent='Testing…';
  apiLoad().then(ok=>{
    st.textContent = ok ? 'Connected — data loaded from the sheet.' : 'Could not connect. Check the URL, the token, and that the Web App is deployed with access "Anyone".';
    if(ok){ toast('Connected to the sheet.'); render(); }
  });
}
function saveSync(){
  readSyncInputs(); closeModal();
  apiLoad().then(ok=>{ toast(ok?'Connected to the sheet.':'Saved. Could not reach the backend yet.'); render(); });
}
function clearSync(){
  localStorage.setItem('wt360_api_url',''); localStorage.removeItem('wt360_api_token');
  API_OK=false; closeModal(); toast('Disconnected. Using this browser only.'); render();
}

/* ---- PWA: install prompt + offline service worker ---- */
let canInstall=false, deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; canInstall=true; if(current) render(); });
window.addEventListener('appinstalled',()=>{ canInstall=false; deferredPrompt=null; toast('WorkTrac360 added to your device.'); if(current) render(); });
function installApp(){
  if(!deferredPrompt){ toast('Open your browser menu and choose "Add to Home screen".'); return; }
  deferredPrompt.prompt();
  if(deferredPrompt.userChoice) deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; canInstall=false; if(current) render(); });
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ------------------------------ helpers --------------------------------- */
function dateStr(o){ const d=new Date(); d.setDate(d.getDate()+o); return d.toISOString().slice(0,10); }
function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function user(id){ return DB.users.find(u=>u.id===id) || {name:'—',section:'',role:'',enroll:''}; }
function fmt(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function toDate(s){ return s? new Date(s+'T00:00:00') : null; }
function isOverdue(t){ return t.dueDate && ['Not Started','In Progress','Need Support','Blocked'].includes(t.status) && toDate(t.dueDate) < new Date(new Date().toDateString()); }
function badge(x,c){ return `<span class="badge ${c}">${esc(x)}</span>`; }
function statusBadge(s){ return badge(s, STATUS_COLOR[s]||'b-grey'); }
function prioBadge(p){ return badge(p, PRIO_COLOR[p]||'b-grey'); }
function typeBadge(t){
  if(t==='superadmin') return badge('Super Admin','b-orange');
  return badge(t==='supervisor'?'Supervisor':'Member', t==='supervisor'?'b-purple':'b-grey');
}
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function toast(m){ const el=document.getElementById('toast'); el.innerHTML=`<div class="toast">${esc(m)}</div>`; setTimeout(()=>el.innerHTML='',3200); }
function notify(toId, title, body){ DB.notify.unshift({id:uid('n'), at:Date.now(), to:toId, title, body, read:false}); if(DB.notify.length>600) DB.notify.pop(); }
function notifyDept(sec, title, body, exceptId){ DB.users.filter(u=>u.type==='supervisor'&&u.section===sec&&u.status==='approved'&&u.id!==exceptId).forEach(s=>notify(s.id,title,body)); }
function myNotifs(){ return current? DB.notify.filter(n=>n.to===current.id) : []; }
function unread(){ return myNotifs().filter(n=>!n.read).length; }

/* access ----------------------------------------------------------------- */
function isSuper(){ return !!current && current.type==='superadmin'; }
function visibleTasks(u){
  if(u.type==='superadmin') return DB.tasks;
  if(u.type==='supervisor') return DB.tasks.filter(t=>t.section===u.section);
  return DB.tasks.filter(t=>t.assigneeId===u.id);
}
function deptSupervisors(sec){ return DB.users.filter(u=>u.type==='supervisor' && u.section===sec && u.status==='approved'); }
function rolesOf(sec){ return DB.roles.filter(r=>r.section===sec).sort((a,b)=>a.name.localeCompare(b.name)); }
function ensureRole(sec, name){
  name = String(name||'').trim(); if(!name) return;
  if(!DB.roles.some(r=>r.section===sec && r.name.toLowerCase()===name.toLowerCase()))
    DB.roles.push({id:uid('r'), section:sec, name});
}

let current=null, view='dashboard', taskFilter='All', authMode='signin', authMsg=null;
let dateBasis='created', dateFrom='', dateTo='';
let dashPeriod='month';   /* today | week | month */
function periodRange(){
  const to=dateStr(0);
  if(dashPeriod==='today') return {from:to,to:to};
  if(dashPeriod==='week') return {from:dateStr(-6),to:to};
  return {from:firstOfMonth(),to:to};
}

/* ------------------------------- render --------------------------------- */
function render(){
  const app=document.getElementById('app');
  if(!current){
    if(authMode==='register') app.innerHTML = registerView();
    else if(authMode==='superadmin') app.innerHTML = superAdminView();
    else app.innerHTML = loginView();
    return;
  }
  app.innerHTML = shell();
  wrapTables(app);
}
/* Let wide data tables scroll horizontally inside their card on small screens. */
function wrapTables(root){
  if(!root) return;
  root.querySelectorAll('table').forEach(t=>{
    if(t.parentElement && t.parentElement.classList.contains('tw')) return;
    const d=document.createElement('div'); d.className='tw';
    t.parentNode.insertBefore(d,t); d.appendChild(t);
  });
}

/* --------------------------------- auth --------------------------------- */
function loginView(){
  const none = DB.users.length===0;
  return `<div class="auth-wrap"><div class="auth-card">

function registerSuperAdmin(){
  const code=(document.getElementById('saCode').value||'').trim();
  const name=document.getElementById('saName').value.trim();
  const enroll=document.getElementById('saEnroll').value.trim();
  const section=document.getElementById('saSection').value;
  const role=document.getElementById('saRole').value.trim()||'Super Admin';
  if(code!==SUPER_SETUP_CODE){ toast('Invalid setup code.'); return; }

  if(DB.users.some(u=>u.enroll.toLowerCase()===enroll.toLowerCase())){ toast('This enroll ID is already registered.'); return; }
  const anySuper=DB.users.some(u=>u.type==='superadmin' && u.status==='approved');
  DB.users.push({id:uid('u'), enroll, name, section, role, type:'superadmin', status: anySuper?'pending':'approved'});
  if(anySuper){
    DB.users.filter(u=>u.type==='superadmin'&&u.status==='approved').forEach(s=>notify(s.id,'Super Admin registration',`${name} (${enroll}) requested Super Admin access. Approve or reject in Team.`));

  } else {
    authMsg='Super Admin created. You can sign in now.';

function hintRole(){
  const sec=document.getElementById('srSection').value;
  const type=document.getElementById('srType').value;
  const inp=document.getElementById('srRole');
  if(inp && !inp.value.trim()){
    inp.placeholder = type==='superadmin' ? 'Super Admin'

function showRegister(){ authMode='register'; authMsg=null; render(); }
function showSignin(){ authMode='signin'; authMsg=null; render(); }

function selfRegister(){
  let type=document.getElementById('srType').value;
  const name=document.getElementById('srName').value.trim();
  const enroll=document.getElementById('srEnroll').value.trim();
  const section=document.getElementById('srSection').value;
  const role=document.getElementById('srRole').value.trim();
  if(!name||!enroll||!role){ toast('Please fill name, enroll and role.'); return; }
  if(DB.users.some(u=>u.enroll.toLowerCase()===enroll.toLowerCase())){ toast('This enroll ID is already registered.'); return; }
  ensureRole(section, role);

  /* public registration can only create Team Member or Supervisor */
  if(type!=='supervisor') type='member';

  if(type==='supervisor'){
    DB.users.push({id:uid('u'), enroll, name, section, role, type, status:'approved'});
    notifyDept(section, 'New supervisor', `${name} (${enroll}) joined ${section} as ${role}.`, null);
    save(); authMsg='Supervisor account created. You can sign in now.'; authMode='signin'; render(); return;
  }
  DB.users.push({id:uid('u'), enroll, name, section, role, type, status:'pending'});
  const sups=deptSupervisors(section);
  sups.forEach(s=>notify(s.id, 'Registration pending', `${name} (${enroll}) registered as ${role} in ${section}. Approve or reject in Team.`));
  save();
  authMsg = sups.length ? 'Registration submitted. Your supervisor will approve it.'
                        : 'Registration submitted. It will be approved once a supervisor is available for your department.';
  authMode='signin'; render();
}
function loginByInput(){
  const v=(document.getElementById('loginId').value||'').trim().toLowerCase();
  const u=DB.users.find(x=>x.enroll.toLowerCase()===v);
  if(!u){ toast('No account found for this enroll ID.'); return; }
  if(u.status!=='approved'){ toast('Your registration is awaiting supervisor approval.'); return; }
  login(u.id);
}

function superDashboardView(){
  const ts=DB.tasks;

    return {s,sups,mems,pnd,n:t.length,c,dn,e,ac,ov,comp:t.length?Math.round(dn*100/t.length):0};
  });

  const legend=STATUSES.map(k=>`<span class="pill" style="border-left:5px solid ${STATUS_HEX[k]}">${esc(k)}</span>`).join('');

  const summaryRows=deptStats.map(d=>`<tr>
    <td><b>${esc(d.s)}</b></td>
    <td>${d.sups}</td><td>${d.mems}</td><td>${d.pnd?badge(d.pnd,'b-orange'):'—'}</td>
    <td><b>${d.n}</b></td><td>${d.dn}</td>
    <td><div class="bar" style="min-width:70px"><i style="width:${d.comp}%;background:${d.comp>=75?'#2ECC71':d.comp>=40?'#E67E22':'#C0392B'}"></i></div><span class="small">${d.comp}%</span></td>

    <td><button class="btn sm ghost" onclick="window.__teamSec='${d.s}';go('team')">Team</button>
        <button class="btn sm ghost" onclick="window.__assignSec='${d.s}';window.__assignRole='';assignRows=[];go('assign')">Assign</button>
        <button class="btn sm ghost" onclick="window.__repSec='${d.s}';go('reports')">Report</button></td></tr>`).join('');

  const stacked=deptStats.filter(d=>d.n>0).map(d=>{
    const segs=STATUSES.filter(k=>d.c[k]>0).map(k=>`<div style="width:${(d.c[k]*100/d.n).toFixed(2)}%;background:${STATUS_HEX[k]}" title="${esc(k)}: ${d.c[k]}"></div>`).join('');
    return `<tr><td style="white-space:nowrap;padding-right:12px"><b>${esc(d.s)}</b></td>
      <td style="width:100%"><div style="display:flex;height:16px;border-radius:4px;overflow:hidden;background:#eef1f5">${segs}</div></td>
      <td style="padding-left:12px;text-align:right"><b>${d.n}</b></td></tr>`;
  }).join('')||'<tr><td colspan="3" class="empty">No tasks yet.</td></tr>';

  const detailRows=deptStats.map(d=>`<tr><td><b>${esc(d.s)}</b></td>
    ${STATUSES.map(k=>`<td>${d.c[k]||'—'}</td>`).join('')}<td><b>${d.n}</b></td>
    <td class="small">${d.e} / ${d.ac}</td></tr>`).join('');

  const overList=ts.filter(isOverdue).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).slice(0,10).map(t=>`
    <tr><td class="small">${esc(t.dueDate)}</td>
      <td><b>${esc(t.code)}</b><div class="small muted">${esc(t.title)}</div></td>
      <td class="small">${esc(t.section)}</td><td class="small">${esc(user(t.assigneeId).name)}</td>
      <td>${statusBadge(t.status)}</td>
      <td><button class="btn sm ghost" onclick="openTask('${t.id}')">Open</button></td></tr>`).join('');

  const recent=ts.slice().sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,8).map(t=>`
    <tr><td><b>${esc(t.code)}</b><div class="small muted">${esc(t.title)}</div></td>
      <td class="small">${esc(t.section)}</td><td>${esc(user(t.assigneeId).name)}</td>
      <td>${statusBadge(t.status)}</td><td class="small">${fmt(t.updatedAt)}</td>
      <td><button class="btn sm ghost" onclick="openTask('${t.id}')">Open</button></td></tr>`).join('');

  /* ---------------- period-scoped performance metrics ---------------- */
  const pr=periodRange();
  const pDays=daysBetween(pr.from,pr.to);
  const perDay=+DB.settings.dailyMinutes||480;
  const capRange=perDay*pDays;
  const periodLabel={today:'Today',week:'Last 7 days',month:'This month'}[dashPeriod]||'This month';
  let pts=DB.tasks.filter(t=>t.dueDate && t.dueDate>=pr.from && t.dueDate<=pr.to);
  if(!pts.length) pts=DB.tasks;

  const totalP=pts.length;
  const doneP=pts.filter(t=>t.status==='Done'||t.status==='Verified').length;
  const verifiedP=pts.filter(t=>t.status==='Verified').length;
  const completionPct=totalP?Math.round(doneP*100/totalP):0;
  const estP=pts.reduce((a,t)=>a+(+t.estMin||0),0);
  const actP=pts.reduce((a,t)=>a+(+t.actualMin||0),0);
  const adherencePct=estP?Math.round(estP*100/Math.max(actP,1)):0;
  const lateP=pts.filter(t=>(t.status==='Done'||t.status==='Verified') && t.dueDate && dstr(t.updatedAt)>t.dueDate).length;
  const onTimePct=doneP?Math.round((doneP-lateP)*100/doneP):0;
  const approvalPct=doneP?Math.round(verifiedP*100/doneP):0;
  const memberCount=DB.users.filter(u=>u.status==='approved'&&u.type==='member').length;
  const capAll=memberCount*capRange;
  const loadPct=capAll?Math.round(estP*100/capAll):0;
  const score=Math.round(completionPct*0.50+onTimePct*0.30+adherencePct*0.20);
  const employees=DB.users.filter(u=>u.status==='approved'&&u.type!=='superadmin').length;
  const overdueP=pts.filter(isOverdue).length;

  /* ---------------- role aggregation ---------------- */
  const roleAgg={};
  pts.forEach(t=>{
    const k=t.section+'\u0001'+t.role;
    const a=roleAgg[k]||(roleAgg[k]={s:t.section,role:t.role,assigned:0,completed:0,onTime:0,mins:0});
    a.assigned++; a.mins+=(+t.estMin||0);
    if(t.status==='Done'||t.status==='Verified'){ a.completed++; if(t.dueDate && dstr(t.updatedAt)<=t.dueDate) a.onTime++; }
  });
  const roleRowsAgg=Object.keys(roleAgg).map(k=>{
    const a=roleAgg[k];
    a.members=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&u.section===a.s&&u.role===a.role).length;
    a.cap=a.members*capRange;
    a.load=a.cap?Math.round(a.mins*100/a.cap):0;
    a.perf=a.assigned?Math.round(a.completed*100/a.assigned):0;
    a.signal=a.load>100?'Redistribute load':(a.load<80?'Available capacity':'Healthy');
    return a;
  }).sort((a,b)=>b.load-a.load);

  const roleLoadRows=roleRowsAgg.slice(0,6).map(a=>{
    const col=a.load>100?'#C0392B':(a.load<80?'#E67E22':'#2E86C1');
    return `<div style="margin-bottom:14px">

      <div class="bar" style="margin-top:5px"><i style="width:${Math.min(a.load,100)}%;background:${col}"></i></div>
    </div>`;
  }).join('')||'<div class="empty">No tasks in this period.</div>';

  const signalBadge=s=> s==='Healthy'?badge('Healthy','b-green'):(s==='Redistribute load'?badge('Redistribute load','b-red'):badge('Available capacity','b-orange'));
  const rolePerfRows=roleRowsAgg.map(a=>`<tr>
      <td><b>${esc(a.role)}</b><div class="small muted">${esc(a.s)}</div></td>
      <td>${a.assigned}</td><td>${a.completed}</td><td>${a.onTime}</td>
      <td>${a.load}%</td><td>${a.perf}%</td><td>${signalBadge(a.signal)}</td></tr>`).join('')
      ||'<tr><td colspan=7 class="empty">No role activity in this period.</td></tr>';

  const donut=(v,col)=>{ v=Math.max(0,Math.min(100,v));
    return `<svg width="150" height="150" viewBox="0 0 42 42" style="display:block;margin:0 auto">
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="#e8edf3" stroke-width="6"></circle>
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${v} ${100-v}" stroke-dashoffset="25"></circle>
      <text x="21" y="21.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#1F4E78">${v}%</text>
    </svg>`;
  };

  return `
  <div class="card" style="padding:16px 20px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <h2 style="margin:0 0 4px">Daily operations overview</h2>
        <div class="small muted">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})} &nbsp;|&nbsp; All departments &nbsp;|&nbsp; ${employees} employees</div>
      </div>
      <div class="row" style="align-items:center;gap:14px">
        <div class="field" style="min-width:150px;margin:0"><label>Period</label>
          <select onchange="dashPeriod=this.value;render()">
            <option value="today" ${dashPeriod==='today'?'selected':''}>Today</option>
            <option value="week" ${dashPeriod==='week'?'selected':''}>Last 7 days</option>
            <option value="month" ${dashPeriod==='month'?'selected':''}>This month</option>
          </select></div>
        <div class="small muted">Last updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>
  </div>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="kpi2"><div class="t">Assigned workload</div>
      <div class="n" style="color:${loadColor(loadPct)}">${loadPct}%</div>
      <div class="s">Balanced target: 80–95%${loadPct>100?' · overloaded':(loadPct<80?' · underloaded':'')}</div></div>
    <div class="kpi2"><div class="t">Task completion</div>
      <div class="n" style="color:#2E86C1">${completionPct}%</div>
      <div class="s">${doneP} of ${totalP} tasks done</div></div>
    <div class="kpi2"><div class="t">On-time completion</div>
      <div class="n" style="color:${onTimePct>=80?'#1E8449':'#E67E22'}">${onTimePct}%</div>
      <div class="s">${lateP} task(s) completed late</div></div>
  </div>

  <div class="grid g2">

      Period <b>${periodLabel}</b> &nbsp;·&nbsp; Overdue <b style="color:${overdueP?'#C0392B':'#1E8449'}">${overdueP}</b> &nbsp;·&nbsp;
      Super Admin view — all departments</div>

/* ---------------------------- CSV bulk import --------------------------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){ /* ignore */ }
      else cur+=c;
    }
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function downloadTemplate(){
  const csv='name,enroll,role,type\nAbdul Karim,560901,Line Operator,member\nMd. Rashed,560902,Shift Incharge,supervisor\n';
  download('ACCL_team_template.csv', csv);
}
function importCSV(input){
  const f=input.files && input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=function(e){
    let rows;
    try{ rows=parseCSV(String(e.target.result||'')); }catch(err){ toast('Could not read the CSV file.'); return; }
    if(!rows.length){ toast('The CSV file is empty.'); return; }

    let idx={name:0, enroll:1, role:2, type:3};
    const first=rows[0].map(x=>String(x).trim().toLowerCase());
    const hasHeader=first.some(h=>['name','full name','fullname','enroll','enroll id','enrollid','enroll no','role','designation','type','account type'].indexOf(h)>=0);
    let start=0;
    if(hasHeader){
      const find=arr=>first.findIndex(h=>arr.indexOf(h)>=0);
      idx={
        name: find(['name','full name','fullname']),
        enroll: find(['enroll','enroll id','enrollid','enroll no','enrollment','id']),
        role: find(['role','designation','role / designation','role/designation']),
        type: find(['type','account type'])
      };
      start=1;
    }

    let added=0, skipped=0, sup=0;
    for(let i=start;i<rows.length;i++){
      const r=rows[i];
      const g=k=> (idx[k]>=0 && idx[k]<r.length) ? String(r[idx[k]]==null?'':r[idx[k]]).trim() : '';
      const name=g('name'), enroll=g('enroll');
      const role=g('role')||'Team Member';
      let type=(g('type')||'member').toLowerCase();
      type = type.indexOf('sup')===0 ? 'supervisor' : 'member';
      if(!name || !enroll){ skipped++; continue; }
      if(DB.users.some(u=>u.enroll.toLowerCase()===enroll.toLowerCase())){ skipped++; continue; }
      ensureRole(teamSec(), role);
      DB.users.push({id:uid('u'), enroll, name, section:teamSec(), role, type, status:'approved'});
      if(type==='supervisor') sup++;
      added++;
    }
    save();
    input.value='';
    toast(added+' added'+(sup?(' ('+sup+' supervisor'+(sup>1?'s':'')+')'):'')+', '+skipped+' skipped (missing or duplicate).');
    render();
  };
  reader.onerror=function(){ toast('Could not read the CSV file.'); };
  reader.readAsText(f);
}

/* ------------------------------- workload ------------------------------- */
function loadColor(p){ return p>100?'#C0392B':p>=80?'#E67E22':'#1E8449'; }
function workloadScope(u, sec){ return isSuper() ? (sec==='All' || u.section===sec) : (u.section===current.section); }
function firstOfMonth(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-01'; }
function daysBetween(a,b){ const A=new Date(a+'T00:00:00'), B=new Date(b+'T00:00:00'); return Math.max(1, Math.round((B-A)/86400000)+1); }
function workloadView(){
  const avail=+DB.settings.dailyMinutes||480;
  const defFrom=firstOfMonth(), defTo=(dateStr(-1)>defFrom?dateStr(-1):defFrom);
  const from=window.__loadFrom||defFrom;
  const to=window.__loadTo||defTo;
  const days=daysBetween(from,to);
  const cap=avail*days;                       /* available minutes per person over the range */
  const sec=isSuper() ? (window.__loadSec||'All') : current.section;
  const scope=u=>workloadScope(u, sec);
  const inScopeSec=s=>isSuper()?(sec==='All'||s===sec):(s===current.section);

  const dayTasks=DB.tasks.filter(t=>t.dueDate && t.dueDate>=from && t.dueDate<=to && inScopeSec(t.section));

  /* ---- by role ---- */
  const roleKeys=[];
  DB.roles.forEach(r=>{ if(isSuper()?(sec==='All'||r.section===sec):r.section===current.section) roleKeys.push(r.section+'\u0001'+r.name); });
  const roleRows=roleKeys.map(k=>{
    const [s,role]=k.split('\u0001');
    const mems=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&u.section===s&&u.role===role);
    const ts=dayTasks.filter(t=>t.section===s&&t.role===role);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    const av=mems.length*cap;
    return {s,role,mems:mems.length,ts:ts.length,mins,av,pct:av?Math.round(mins*100/av):0};
  }).sort((a,b)=>b.pct-a.pct);

  /* ---- by person ---- */
  const memberRows=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&scope(u)).map(u=>{
    const ts=dayTasks.filter(t=>t.assigneeId===u.id);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    return {u,ts:ts.length,mins,pct:Math.round(mins*100/cap)};
  }).sort((a,b)=>b.pct-a.pct);

  const totMins=dayTasks.reduce((a,t)=>a+(+t.estMin||0),0);
  const totAv=memberRows.length*cap;
  const totPct=totAv?Math.round(totMins*100/totAv):0;

  const bar=p=>`<div class="bar" style="min-width:80px"><i style="width:${Math.min(p,100)}%;background:${loadColor(p)}"></i></div><span class="small"><b>${p}%</b></span>`;

  /* ---- by department (super admin) ---- */
  const deptRows=SECTIONS.map(s=>{
    const mems=DB.users.filter(u=>u.status==='approved'&&u.type==='member'&&u.section===s);
    const ts=dayTasks.filter(t=>t.section===s);
    const mins=ts.reduce((a,t)=>a+(+t.estMin||0),0);
    const av=mems.length*cap;
    return {s,mems:mems.length,ts:ts.length,mins,av,pct:av?Math.round(mins*100/av):0};
  }).filter(d=>d.mems||d.ts).sort((a,b)=>b.pct-a.pct);

  const deptTable=deptRows.map(d=>`<tr>
      <td><b>${esc(d.s)}</b></td><td>${d.mems}</td><td>${d.ts}</td><td>${d.mins}</td><td>${d.av}</td>
      <td>${bar(d.pct)}</td>
      <td><button class="btn sm ghost" onclick="window.__loadSec='${d.s}';go('workload')">Open</button></td></tr>`).join('')
      ||'<tr><td colspan=7 class="empty">No department load for this date.</td></tr>';

  const deptCard = isSuper() ? `
  <div class="card"><h2>Load by Department</h2>
    <p class="desc">Department-wise capacity vs assigned minutes. Available = members × ${avail} × ${days} days.</p>
    <table><tr><th>Department</th><th>Members</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th><th></th></tr>
    ${deptTable}</table>
  </div>` : '';

  const roleTable=roleRows.map(r=>`<tr>
      <td><b>${esc(r.role)}</b><div class="small muted">${esc(r.s)}</div></td>
      <td>${r.mems}</td><td>${r.ts}</td><td>${r.mins}</td><td>${r.av}</td>
      <td>${bar(r.pct)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">No roles in scope.</td></tr>';

  const memberTable=memberRows.map(m=>`<tr>
      <td><b>${esc(m.u.name)}</b><div class="small muted">${esc(m.u.enroll)} · ${esc(m.u.section)}</div></td>
      <td>${esc(m.u.role)}</td><td>${m.ts}</td><td>${m.mins}</td><td>${cap}</td>
      <td>${bar(m.pct)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">No team members in scope.</td></tr>';

  return `
  <div class="card"><h2>Workload — ${esc(sec==='All'?'All Departments':sec)}</h2>
    <p class="desc">Capacity vs assigned task minutes over a date range. Load % = assigned minutes ÷ available minutes.</p>
    <div class="row">
      <div class="field" style="min-width:160px"><label>From</label>
        <input type="date" value="${from}" onchange="window.__loadFrom=this.value;render()"></div>
      <div class="field" style="min-width:160px"><label>To</label>
        <input type="date" value="${to}" onchange="window.__loadTo=this.value;render()"></div>
      <button class="btn ghost" onclick="window.__loadFrom='';window.__loadTo='';render()">This month</button>
      ${isSuper()?`<div class="field" style="min-width:200px"><label>Department</label>
        <select onchange="window.__loadSec=this.value;render()">
          <option value="All" ${sec==='All'?'selected':''}>All departments</option>
          ${SECTIONS.map(s=>`<option ${sec===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select></div>`:''}
      <div class="field" style="min-width:180px"><label>Available minutes / person / day</label>
        <input type="number" min="1" value="${avail}" onchange="DB.settings.dailyMinutes=+this.value||480;save();render()"></div>
    </div>
    <div class="grid g4">
      <div class="kpi"><div class="v">${dayTasks.length}</div><div class="l">Tasks in range</div></div>
      <div class="kpi"><div class="v">${totMins}</div><div class="l">Assigned minutes</div></div>
      <div class="kpi"><div class="v">${totAv}</div><div class="l">Available minutes</div></div>
      <div class="kpi"><div class="v" style="color:${loadColor(totPct)}">${totPct}%</div><div class="l">Overall load</div></div>
    </div>
    <p class="hint"><b>${days}</b> day(s) · ${esc(from)} → ${esc(to)} · per person capacity = ${avail} × ${days} = <b>${cap} min</b>.
      &nbsp; Load colour: <b style="color:#1E8449">under 80%</b> · <b style="color:#E67E22">80–100%</b> · <b style="color:#C0392B">over 100%</b></p>
  </div>

  <div class="card"><h2>Load by Role</h2>
    <p class="desc">Available minutes = members × ${avail} × ${days} days.</p>
    <table><tr><th>Role</th><th>Members</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th></tr>
    ${roleTable}</table>
  </div>

  ${deptCard}

  <div class="card"><h2>Load by Team Member</h2>
    <p class="desc">Available minutes = ${avail} × ${days} days = ${cap} min per person.</p>
    <table><tr><th>Member</th><th>Role</th><th>Tasks</th><th>Assigned min</th><th>Available min</th><th>Load %</th></tr>
    ${memberTable}</table>
  </div>`;
}

function notifyView(){
  const list=myNotifs();
  const rows=list.map(n=>`<div class="nrow ${n.read?'':'unread'}">
      <div class="t">${esc(n.title)}</div><div class="b">${esc(n.body)}</div><div class="m">${fmt(n.at)}</div></div>`).join('');
  return `<div class="card"><h2>Notifications</h2>
    <p class="desc">Task assignments, approvals and updates relevant to you.</p>
    ${rows||'<div class="empty">No notifications.</div>'}</div>`;
}

/* ------------------------------ task detail ----------------------------- */
function openTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  const a=user(t.assigneeId), s=user(t.supervisorId);
  const isAssignee=current.id===t.assigneeId;
  const isSup = isSuper() || (current.type==='supervisor' && current.section===t.section);
  const comments=t.comments.map(c=>`<div style="border-left:3px solid #cfe0ee;padding:6px 10px;margin-bottom:6px">
    <b>${esc(user(c.by).name)}</b> <span class="small muted">${fmt(c.at)}</span><div class="small">${esc(c.text)}</div></div>`).join('')||'<div class="small muted">No comments.</div>';
  const atts=t.attachments.map(f=>`<span class="pill">📎 ${esc(f.name)} <span class="muted">${esc(f.size)}</span></span>`).join('')||'<span class="small muted">No attachments.</span>';
  const statusOpts=MEMBER_STATUSES.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('');
  const memberPanel=isAssignee?`<h3>Update status</h3>
    <div class="row">
      <div class="field" style="min-width:170px"><label>Status</label><select id="stSel">${statusOpts}</select></div>
      <div class="field" style="min-width:130px"><label>Actual minutes</label><input id="stMin" type="number" value="${t.actualMin||0}"></div>
      <button class="btn green" onclick="updateStatus('${t.id}')">Submit update</button>
      <button class="btn ghost" onclick="toggleTimer('${t.id}')">${t.timerStart?'⏹ Stop timer':'▶ Start timer'}</button>
    </div>`:'';
  const supPanel=isSup?`<h3>Supervisor actions</h3>
    <div class="row">
      <button class="btn green" onclick="verifyTask('${t.id}',1)">✔ Verify as done</button>
      <button class="btn red" onclick="verifyTask('${t.id}',0)">↺ Reopen / reject</button>
    </div>`:'';
  modal(`
    <h2>${esc(t.code)} · ${esc(t.title)}</h2>
    <div style="margin-bottom:10px">${statusBadge(t.status)} ${prioBadge(t.priority)} ${badge(t.section,'b-blue')} ${badge(t.role,'b-grey')} ${isOverdue(t)?badge('Overdue','b-red'):''}</div>
    <div class="grid g2 small">
      <div><b>Assignee:</b> ${esc(a.name)} (${esc(a.enroll)})</div><div><b>Supervisor:</b> ${esc(s.name)}</div>
      <div><b>Estimated:</b> ${t.estMin} min</div><div><b>Actual:</b> ${t.actualMin} min ${t.timerStart?'· timer running':''}</div>
      <div><b>Shift:</b> ${esc(t.shift)}</div><div><b>Frequency:</b> ${esc(t.frequency)}</div>
      <div><b>Due:</b> ${t.dueDate||'—'}</div><div><b>Created:</b> ${fmt(t.createdAt)}</div>
    </div>
    <h3>Attachments (evidence)</h3><div>${atts}</div>
    ${(isAssignee||isSup)?`<div style="margin-top:8px"><input type="file" onchange="attachFile('${t.id}',this)"></div>`:''}
    <h3>Comments</h3><div>${comments}</div>
    <div class="row" style="margin-top:8px"><div class="field" style="flex:1;min-width:220px;margin-bottom:0"><input id="cmtText" placeholder="Write a comment…"></div>
      <button class="btn ghost" onclick="addComment('${t.id}')">Comment</button></div>
    ${memberPanel}${supPanel}
    ${isSup?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <button class="btn red" onclick="deleteTask('${t.id}')">🗑 Delete this task</button></div>`:''}
    <div style="margin-top:16px"><button class="btn grey" onclick="closeModal()">Close</button></div>`);
}
function updateStatus(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status=document.getElementById('stSel').value; t.actualMin=+document.getElementById('stMin').value||0; t.updatedAt=Date.now();
  if(t.supervisorId) notify(t.supervisorId, `Task ${t.code} updated`, `${current.name} set ${t.code} (${t.title}) to "${t.status}". Actual: ${t.actualMin} min.`);
  save(); toast('Status updated.'); closeModal(); render();
}
function toggleTimer(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  if(t.timerStart){ const mins=Math.max(1,Math.round((Date.now()-t.timerStart)/60000)); t.actualMin=(+t.actualMin||0)+mins; t.timerStart=null; toast(`Timer stopped · +${mins} min.`); }
  else { t.timerStart=Date.now(); toast('Timer started.'); }
  t.updatedAt=Date.now(); save(); openTask(id);
}
function attachFile(id,input){ const t=DB.tasks.find(x=>x.id===id); const f=input.files[0]; if(!f) return;
  t.attachments.push({name:f.name,size:Math.round(f.size/1024)+' KB'}); save(); openTask(id); }
function addComment(id){ const t=DB.tasks.find(x=>x.id===id); const txt=document.getElementById('cmtText').value.trim(); if(!txt) return;
  t.comments.push({by:current.id,at:Date.now(),text:txt}); t.updatedAt=Date.now(); save(); openTask(id); }
function verifyTask(id, ok){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status=ok?'Verified':'Reopened'; t.updatedAt=Date.now();
  notify(t.assigneeId, `Task ${t.code} ${ok?'verified':'reopened'}`, `${current.name} ${ok?'verified':'reopened'} ${t.code} (${t.title}).`);
  save(); toast(ok?'Task verified.':'Task reopened.'); closeModal(); render();
}
function modal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`; wrapTables(bg); bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); }
function closeModal(){ const m=document.getElementById('modalBg'); if(m) m.remove(); }

try{ localStorage.removeItem('wt360_api_token'); }catch(e){}
load();
render();
if(apiUrl()) apiLoad().then(ok=>{ if(ok) render(); });
setInterval(()=>{
  if(!current || !apiUrl()) return;
  if(document.getElementById('modalBg')) return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  apiLoad().then(ok=>{ if(ok) render(); });
}, 60000);
</script>
</body>
</html>
